name: event_scheduler_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

workspace:
  - packages/domain
  - packages/blocs
  - packages/api_contract
  - packages/api_mapping
  - packages/api_client
  - apps/server


dependencies:
  flutter:
    sdk: flutter
  domain: ^1.0.0
  api_client: ^1.0.0
  api_contract: ^1.0.0
  api_mapping: ^1.0.0
  flutter_secure_storage: ^10.0.0
  blocs: ^1.0.0
  flutter_bloc: ^8.1.6
  equatable: ^2.1.0
  go_router: ^13.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/images/applogo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true